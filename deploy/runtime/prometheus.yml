global:
  scrape_interval: 30s
  scrape_timeout: 20s
  evaluation_interval: 30s
  external_labels:
    icheck_region: local
    icheck_host: zhao

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: snmp
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib, system]
    file_sd_configs:
      - files:
          - /etc/icheck/prometheus/snmp-targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [snmp_auth]
        target_label: __param_auth
      - source_labels: [snmp_module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116

  - job_name: snmp_exporter
    static_configs:
      - targets: [127.0.0.1:9116]

  - job_name: windows
    metrics_path: /metrics
    params:
      collect[]:
        - cpu
        - logical_disk
        - memory
        - net
        - os
        - service
        - system
    file_sd_configs:
      - files:
          - /etc/icheck/prometheus/windows-targets.json
        refresh_interval: 30s
