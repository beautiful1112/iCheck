[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icheck"
version = "0.1.0"
description = "AI-native, self-extensible IT operations agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "jsonschema>=4.23,<5",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
icheck-collector = "icheck.collector_worker:main"
icheck-agent-worker = "icheck.agent_worker:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
